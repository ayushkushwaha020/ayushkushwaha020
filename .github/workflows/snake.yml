name: GitHub Profile Analytics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - v3-golden

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Generate contribution analytics from GitHub profile data
        run: |
          mkdir -p scripts dist
          python scripts/generate_profile_analytics.py

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ayushkushwaha020
          outputs: |
            dist/github-snake.svg?color_snake=%23C9A227&color_dots=%23090A0C,%23A8871D,%23C9A227,%23F0C75E,%23F7E7A8

      - name: Publish profile analytics
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
