name: Version 5 Profile Analytics and Daily Quote

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Validate analytics generator syntax
        run: python -m py_compile scripts/generate_profile_analytics.py

      - name: Generate contribution analytics from GitHub profile data
        run: |
          mkdir -p scripts dist
          python scripts/generate_profile_analytics.py

      - name: Generate Version 2 contribution snake for rollback
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ayushkushwaha020
          outputs: |
            dist/github-snake-pink-v2.svg?color_snake=%23FF69B4&color_dots=%23181C24,%23F8BBD0,%23EF93C4,%23FF69B4,%23FF1493

      - name: Publish profile analytics
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
