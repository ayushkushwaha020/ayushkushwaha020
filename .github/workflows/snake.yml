name: GitHub Profile Analytics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ayushkushwaha020
          outputs: |
            dist/github-snake.svg?color_snake=%23FF69B4&color_dots=%23181C24,%23F8BBD0,%23EF93C4,%23FF69B4,%23FF1493

      - name: Generate GitHub streak stats
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=ayushkushwaha020&theme=transparent&hide_border=true&background=transparent&ring=FF69B4&fire=FF69B4&currStreakLabel=FF69B4&sideLabels=EF93C4&currStreakNum=FF69B4&sideNums=FF69B4&dates=F8BBD0&disable_animations=true&starting_year=2025&hide_total_contributions=false&card_width=850&card_height=220
          path: dist/github-streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ayushkushwaha020
          options: theme=github-compact&bg_color=181C24&color=FF69B4&title_color=FF69B4&line=FF69B4&point=F8BBD0&area_color=EF93C4&area=true&hide_border=true&hide_title=true&days=90&height=360&radius=8&grid=true
          output_path: dist/github-activity.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish profile analytics
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
