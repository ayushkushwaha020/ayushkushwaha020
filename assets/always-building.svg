<svg xmlns="http://www.w3.org/2000/svg" width="420" height="88" viewBox="0 0 420 88">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#181818"/>
      <stop offset="0.5" stop-color="#3a1634"/>
      <stop offset="1" stop-color="#181818"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" x2="1">
      <stop offset="0" stop-color="#FF69B4"/>
      <stop offset="0.5" stop-color="#FF1493"/>
      <stop offset="1" stop-color="#FF69B4"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="5" y="5" width="410" height="78" rx="39" fill="url(#bg)" stroke="#FF69B4" stroke-width="2"/>
  <rect x="8" y="8" width="404" height="72" rx="36" fill="none" stroke="#FF1493" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
  <circle cx="52" cy="44" r="21" fill="#FF69B4" opacity="0.16"/>
  <text x="52" y="51" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#FF69B4">✦</text>
  <text x="79" y="51" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="1" fill="url(#pink)">ALWAYS BUILDING</text>
  <circle cx="376" cy="28" r="3" fill="#FF69B4" filter="url(#glow)"/>
  <circle cx="391" cy="43" r="2" fill="#F8BBD0"/>
  <circle cx="377" cy="60" r="2.5" fill="#FF1493" filter="url(#glow)"/>
</svg>