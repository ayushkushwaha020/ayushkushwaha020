<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
<title id="title">Thank you for visiting</title>
<desc id="desc">A minimal navy closing banner with a blue accent and a keep-building message.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B1220"/>
    <stop offset="1" stop-color="#111C30"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2563EB"/>
    <stop offset="1" stop-color="#38BDF8"/>
  </linearGradient>
</defs>
<rect width="1200" height="150" rx="16" fill="url(#bg)"/>
<rect x="0" y="0" width="7" height="150" rx="3" fill="url(#accent)"/>
<path d="M890 0V40H960V78H1030V110H1200" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-opacity=".35"/>
<path d="M1000 0V25H1070V60H1140" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-opacity=".25"/>
<circle cx="960" cy="78" r="4" fill="#38BDF8" opacity=".8"/>
<circle cx="1070" cy="25" r="4" fill="#38BDF8" opacity=".8"/>
<text x="48" y="58" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="800" letter-spacing="1.6" fill="#F8FAFC">THANK YOU FOR VISITING</text>
<rect x="49" y="76" width="65" height="3" rx="1.5" fill="url(#accent)"/>
<text x="48" y="108" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#CBD5E1">Keep learning. Keep building. Keep shipping.</text>
<text x="1150" y="126" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="2" fill="#64748B">AYUSH KUSHWAHA</text>
</svg>